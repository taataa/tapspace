<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CSS Transform Lab - Tapspace.js</title>

  <style>
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      margin: 0;
      padding: 1em;
      font-size: 16px;
      color: white;
      background: #000;
      font-family: sans-serif;
    }

    .form-group {
      margin-bottom: 0.62em;
    }

    .transformation-controls label {
      display: inline-block;
      width: 8em;
      text-align: right;
    }

    .space {
      position: relative;
      width: 400px;
      height: 400px;
      background: white;
    }

    .space-item {
      position: absolute;
      top: 0;
      left: 0;
      width: 100px;
      height: 100px;
      background: black;
    }
  </style>
</head>
<body>
  <div id="space"></div>

  <!-- Heading -->
  <h1>CSS Transform Lab – <a style="color: lightgray" href="https://taataa.github.io/tapspace/">Tapspace.js</a></h1>
  <p>This app is for the development of transformation animations in Tapspace. It allows developers to ensure browser behavior is as expected.</p>

  <form class="transformation-controls">
    <div class="form-group">
      <div>
        <label for="helm_a">A</label>
        <input type="number" name="helm_a" required value="1.0" step="0.001" />
      </div>
      <div>
        <label for="helm_b">B</label>
        <input type="number" name="helm_b" required value="0.0" step="0.001" />
      </div>
      <div>
        <label for="helm_x">X</label>
        <input type="number" name="helm_x" required value="0.0" step="0.001" />
      </div>
      <div>
        <label for="helm_y">Y</label>
        <input type="number" name="helm_y" required value="0.0" step="0.001" />
      </div>
    </div>

    <div class="form-group">
      <div>
        <label for="easing">Timing Function</label>
        <select name="easing" id="easing">
          <option value="linear" selected>linear</option>
          <option value="ease">ease</option>
          <option value="ease-in">ease-in</option>
          <option value="ease-out">ease-out</option>
          <option value="ease-in-out">ease-in-out</option>
        </select>
      </div>
      <div>
        <label for="delay">Delay (ms)</label>
        <input type="number" name="delay" required value="0" step="1" />
      </div>
      <div>
        <label for="duration">Duration (ms)</label>
        <input type="number" name="duration" required value="1000" step="1" />
      </div>
    </div>

    <div class="form-group">
      <div>
        <label for="origin_x">Origin X</label>
        <input type="number" name="origin_x" required value="0" step="1" />
      </div>
      <div>
        <label for="origin_y">Origin Y</label>
        <input type="number" name="origin_y" required value="0" step="1" />
      </div>
    </div>


    <div class="form-group">
      <div>
        <button type="button">Go</button>
        <button type="button">Reset</button>
      </div>
    </div>
  </form>

  <div class="space">
    <div id="space-item" class="space-item">
    </div>
  </div>

  <script>
    const item = document.getElementById('space-item')
    item.style.transform = 'matrix(1, 0, 0, 1, 10, 20)'
  </script>
</body>
</html>
