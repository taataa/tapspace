<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CSS Transform Lab - Tapspace.js</title>

  <style>
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      margin: 0;
      padding: 1em;
      font-size: 16px;
      color: white;
      background: #000;
      font-family: sans-serif;
    }

    .form-group {
      margin-bottom: 0.62em;
    }

    .transformation-controls label {
      display: inline-block;
      width: 9em;
      text-align: right;
    }

    .space {
      position: relative;
      width: 400px;
      height: 400px;
      background: white;
    }

    .space-item {
      position: absolute;
      top: 0;
      left: 0;
      transition-property: transform;
    }

    #space-item {
      width: 256px;
      height: 256px;
      background-image: url("../assets/chellah_star.jpg");
    }

    #origin-item {
      width: 11px;
      height: 11px;
      background-image: url("../assets/crosshair.png");
    }

  </style>
</head>
<body>
  <!-- Heading -->
  <h1>CSS Transform Lab – <a style="color: lightgray" href="https://taataa.github.io/tapspace/">Tapspace.js</a></h1>
  <p>This app is for the development of transformation animations in Tapspace. It allows developers to ensure browser behavior is as expected.</p>

  <form class="transformation-controls">
    <div class="form-group">
      <h4>Initial Basis</h4>
      <div>
        <label for="basis-a">Basis A</label>
        <input id="basis-a" type="number" name="basis-a" required value="1.0" step="0.1" />
      </div>
      <div>
        <label for="basis-b">Basis B</label>
        <input id="basis-b" type="number" name="basis-b" required value="0.0" step="0.1" />
      </div>
      <div>
        <label for="basis-x">Basis X</label>
        <input id="basis-x" type="number" name="basis-x" required value="10" step="10" />
      </div>
      <div>
        <label for="basis-y">Basis Y</label>
        <input id="basis-y" type="number" name="basis-y" required value="10" step="10" />
      </div>
    </div>

    <div class="form-group">
      <h4>Transformation</h4>
      <div>
        <label for="trans-a">Transform A</label>
        <input id="trans-a" type="number" name="trans-a" required value="1.0" step="0.1" />
      </div>
      <div>
        <label for="trans-b">Transform B</label>
        <input id="trans-b" type="number" name="trans-b" required value="0.0" step="0.1" />
      </div>
      <div>
        <label for="trans-x">Transform X</label>
        <input id="trans-x" type="number" name="trans-x" required value="40" step="10" />
      </div>
      <div>
        <label for="trans-y">Transform Y</label>
        <input id="trans-y" type="number" name="trans-y" required value="60" step="10" />
      </div>
    </div>

    <div class="form-group">
      <h4>Transition</h4>
      <div>
        <label for="easing">Timing Function</label>
        <select id="easing" name="easing">
          <option value="linear" selected>linear</option>
          <option value="ease">ease</option>
          <option value="ease-in">ease-in</option>
          <option value="ease-out">ease-out</option>
          <option value="ease-in-out">ease-in-out</option>
        </select>
      </div>
      <div>
        <label for="delay">Delay (ms)</label>
        <input id="delay" type="number" name="delay" required value="0" step="1" />
      </div>
      <div>
        <label for="duration">Duration (ms)</label>
        <input id="duration" type="number" name="duration" required value="1000" step="1" />
      </div>
    </div>

    <div class="form-group">
      <div>
        <label for="origin-x">Transform Origin X</label>
        <input id="origin-x" type="number" name="origin-x" required value="0" step="10" />
      </div>
      <div>
        <label for="origin-y">Transform Origin Y</label>
        <input id="origin-y" type="number" name="origin-y" required value="0" step="10" />
      </div>
    </div>

    <div class="form-group">
      <div>
        <button id="btn-go" type="button">Go</button>
        <button id="btn-reset" type="button">Reset Space</button>
        <button id="btn-reset-form" type="button">Reset Form</button>
      </div>
    </div>
  </form>

  <div id="space" class="space">
    <div id="space-item" class="space-item"></div>
    <div id="origin-item" class="space-item"></div>
  </div>

  <script>
    // Elements
    const inputBasisA = document.getElementById('basis-a')
    const inputBasisB = document.getElementById('basis-b')
    const inputBasisX = document.getElementById('basis-x')
    const inputBasisY = document.getElementById('basis-y')

    const inputTrA = document.getElementById('trans-a')
    const inputTrB = document.getElementById('trans-b')
    const inputTrX = document.getElementById('trans-x')
    const inputTrY = document.getElementById('trans-y')

    const inputEasing = document.getElementById('easing')
    const inputDelay = document.getElementById('delay')
    const inputDuration = document.getElementById('duration')

    const inputOriginX = document.getElementById('origin-x')
    const inputOriginY = document.getElementById('origin-y')

    const inputBtnGo = document.getElementById('btn-go')
    const inputBtnReset = document.getElementById('btn-reset')
    const inputBtnResetForm = document.getElementById('btn-reset-form')

    const space = document.getElementById('space')
    const item = document.getElementById('space-item')
    const originItem = document.getElementById('origin-item')

    // Functions to read form state.
    const readBasis = () => {
      const a = parseFloat(inputBasisA.value)
      const b = parseFloat(inputBasisB.value)
      const x = parseFloat(inputBasisX.value)
      const y = parseFloat(inputBasisY.value)
      return { a, b, x, y }
    }

    const readTransform = () => {
      const a = parseFloat(inputTrA.value)
      const b = parseFloat(inputTrB.value)
      const x = parseFloat(inputTrX.value)
      const y = parseFloat(inputTrY.value)
      return { a, b, x, y }
    }

    const readTransition = () => {
      const easing = inputEasing.value
      const delay = parseInt(inputDelay.value)
      const duration = parseInt(inputDuration.value)
      return { easing, delay, duration }
    }

    const readOrigin = () => {
      const x = parseInt(inputOriginX.value)
      const y = parseInt(inputOriginY.value)
      return { x, y }
    }

    const multiply = (ta, tb) => {
      const a = ta.a * tb.a - ta.b * tb.b
      const b = ta.a * tb.b + ta.b * tb.a
      const x = ta.a * tb.x + ta.b * tb.y + ta.x
      const y = -ta.b * tb.x + ta.a * tb.y + ta.y
      return { a, b, x, y }
    }

    const cssMatrix = (tr) => {
      const a = tr.a
      const b = -tr.b
      const c = tr.b
      const d = tr.a
      const x = tr.x
      const y = tr.y
      return `matrix(${a}, ${b}, ${c}, ${d}, ${x}, ${y})`
    }

    const cssOrigin = (p) => {
      return `${p.x}px ${p.y}px`
    }

    const applyTransition = (anim) => {
      item.style.transitionTimingFunction = anim.easing
      item.style.transitionDelay = anim.delay + 'ms'
      item.style.transitionDuration = anim.duration + 'ms'
    }

    const resetItem = () => {
      // Temporarily use immediate transition
      applyTransition({
        easing: 'linear',
        delay: 0,
        duration: 0
      })

      const bt = readBasis()
      const op = readOrigin()

      item.style.transformOrigin = cssOrigin(op)
      item.style.transform = cssMatrix(bt)

      // Wait for immediate item position reset, then set to defaults.
      setTimeout(() => {
        const anim = readTransition()
        applyTransition(anim)
      }, 50)
    }

    const renderOrigin = () => {
      const op = readOrigin()
      const bt = readBasis()
      const tr = readTransform()

      const tt = multiply(tr, bt)

      // Origin is given in item coordinates.
      // Convert to space coordinates.
      const sx = tt.a * op.x + tt.b * op.y + tt.x
      const sy = -tt.b * op.x + tt.a * op.y + tt.y

      // The center of the crosshair image should be at the point
      const SIZE = 11
      const OFFSET = Math.floor(SIZE / 2)
      const offx = sx - OFFSET
      const offy = sy - OFFSET

      originItem.style.left = `${offx}px`
      originItem.style.top = `${offy}px`
    }

    const renderItem = () => {
      const anim = readTransition()
      const op = readOrigin()
      const bt = readBasis()
      const tr = readTransform()

      const tt = multiply(tr, bt)

      applyTransition(anim)
      item.style.transformOrigin = cssOrigin(op)
      item.style.transform = cssMatrix(tt)
    }

    // Bind
    inputBtnGo.addEventListener('click', () => {
      renderItem()
      renderOrigin()
    })
    inputBtnReset.addEventListener('click', () => {
      resetItem()
      renderOrigin()
    })
    inputBtnResetForm.addEventListener('click', () => {
      resetForm()
    })
    // Refresh origin live
    inputOriginX.addEventListener('input', () => {
      renderOrigin()
    })
    inputOriginY.addEventListener('input', () => {
      renderOrigin()
    })

    // Init space to match the form defaults.
    resetItem()
    renderOrigin()

  </script>
</body>
</html>
